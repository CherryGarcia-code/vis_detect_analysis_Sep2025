[metadata]
name = visdetect
version = 0.0.0
description = visdetect analysis package

[options]
packages = find:
package_dir =
    = src
install_requires =
    numpy
    scipy
    pandas
    matplotlib
    seaborn
    tqdm
    pyyaml
    scikit-learn
    pyddm==0.9.0

[tool:pytest]
norecursedirs = cleanup_archive
testpaths = tests
markers =
    slow: marks tests that fit real DDM models (deselect with '-m "not slow"')
