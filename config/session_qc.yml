# Session Quality Control Criteria
# Define profiles for filtering sessions based on behavioral metrics.
# Conditions are evaluated using pandas.DataFrame.eval() syntax.

default:
  description: "Standard filter to exclude disengaged or low-trial sessions."
  rules:
    - name: "High Miss Rate"
      condition: "fraction_miss > 0.38"
      reason: "Subject likely disengaged (Miss fraction > 0.38)"
    
    - name: "Low Engagement (Low Hit/FA)"
      condition: "fraction_hit < 0.05 and fraction_fa < 0.05"
      reason: "Extremely low response rate"

    - name: "Low Trial Count"
      condition: "n_trials < 50"
      reason: "Insufficient data for reliable statistics"

strict:
  description: "Stricter filter for high-quality sessions only."
  rules:
    - name: "High Miss Rate"
      condition: "fraction_miss > 0.30"
      reason: "Miss rate too high"
    
    - name: "Low d-prime"
      condition: "d_prime < 0.5"
      reason: "Poor sensitivity"
