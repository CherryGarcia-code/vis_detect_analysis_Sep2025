# QC parameter profiles for unit selection
# Adjust or add profiles to capture different analysis runs.

# Baseline defaults (match current code defaults)
default:
  require_good_cluster: true
  min_total_spikes: 500
  min_mean_rate_hz: 0.1
  max_isi_viol_frac: 0.2
  min_median_spikes_per_trial: 0.1
  # Optional: set to null to ignore (no upper cap)
  max_median_spikes_per_trial: null

# Striatum-focused, stricter single-unit quality
striatal_strict:
  require_good_cluster: true
  min_total_spikes: 1200       # 1000–1500; pick 1200 as a reasonable middle
  min_mean_rate_hz: 0.1        # SPNs can be sparse; 0.1 Hz lower bound
  max_isi_viol_frac: 0.03      # 0.01–0.05, use 0.03 as compromise
  min_median_spikes_per_trial: 0.1
  max_median_spikes_per_trial: null

# Slightly looser variant for exploratory scans
striatal_lenient:
  require_good_cluster: true
  min_total_spikes: 800
  min_mean_rate_hz: 0.05
  max_isi_viol_frac: 0.08
  min_median_spikes_per_trial: 0.05
  max_median_spikes_per_trial: null
